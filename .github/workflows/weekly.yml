name: Weekly Ventrix Content Brief

on:
  schedule:
    # Every Sunday at 18:00 UTC (2pm EST / 11am PST) — gives Blake the week's brief Sunday night
    - cron: "0 18 * * 0"
  workflow_dispatch: # manual trigger button

jobs:
  build-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scout
        run: python scout/scout.py

      - name: Commit the new brief
        run: |
          git config user.name "Ventrix Scout Bot"
          git config user.email "scout@ventrix.tech"
          git add briefs/
          if git diff --cached --quiet; then
            echo "No new brief to commit"
          else
            git commit -m "scout: weekly brief $(date +%Y-%m-%d)"
            git push
          fi
